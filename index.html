function nz(d,f,v,t='lowpass'){const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),ga=AC.createGain();s.buffer=b;fl.type=t;fl.frequency.value=f;ga.gain.value=v;s.connect(fl);fl.connect(ga);ga.connect(mst);s.start()}
function bp(f,d,v=.15,ty='sine',f2){const o=AC.createOscillator(),ga=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);ga.gain.setValueAtTime(v,n);ga.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(ga);ga.connect(mst);o.start();o.stop(n+d)}
const SF={hit:()=>{nz(.5,500,.7);bp(90,.3,.4,'sine',40)},flat:()=>{nz(.8,2500,.3,'highpass');bp(200,.4,.1,'sawtooth',80)},cc:()=>bp(880,.12,.1,'triangle',1320),down:()=>{nz(.9,900,.8);bp(120,.6,.5,'sine',35)},chk:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>bp(f,.25,.12,'triangle'),i*90)),heli:()=>[0,1,2].forEach(i=>setTimeout(()=>bp(300,.2,.1,'square',240),i*220)),nit:()=>nz(1,1800,.35,'bandpass'),clk:()=>bp(500,.06,.08,'square')};
const sfx=k=>{if(AC&&!muted&&SF[k])try{SF[k]()}catch(e){}};
function audUpd(){if(!AC||!E)return;const t=AC.currentTime,r=G.run&&!paused&&!G.dead,sp=G.speed,n=G.nitting;E.o.frequency.setTargetAtTime(45+sp*.75+(n?25:0),t,.1);E.f.frequency.setTargetAtTime(300+sp*5+(n?900:0),t,.1);E.a.gain.setTargetAtTime(r?.07+(n?.04:0):G.m=='idle'?.02:0,t,.1);E2.o.frequency.setTargetAtTime(22+sp*.37,t,.1);E2.a.gain.setTargetAtTime(r?.05:0,t,.1);let d=9e9;if(r)G.cp.forEach(c=>d=Math.min(d,Math.abs(c.y-G.py)));SR.o.frequency.setTargetAtTime(850+Math.sin(G.time*7)*320,t,.03);SR.a.gain.setTargetAtTime(d<700?.04*(1-d/700):0,t,.1);HL.a.gain.setTargetAtTime(r&&G.heli?.1:0,t,.2)}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(G.cine)cineUpd(dt);else if(G.run&&!paused)upd(dt);else if(G.m=='idle'){G.speed=110;sceneUpd(dt)}draw();audUpd();requestAnimationFrame(loop)}
if(S.seen!==VER&&HAD)whatsNew();else{S.seen=VER;save();menu()}requestAnimationFrame(loop);
