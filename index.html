const VER='4.2',LOG={'4.2':{t:'VERSION 4.2: ACHIEVEMENTS & SECRETS',i:['NEW: 100 achievements with pop-up notifications and one-time cash bonuses (menu > Achievements). Anything you already did is unlocked automatically','Garage and Hangar now live in one menu with a switch at the top','The sky is now only reachable by beating Story 2 or by using the Sky Skip booster (also works in Endless and Sky Patrol)','Boosters that cannot work in the air are no longer offered there','Both secret vehicles (car and aircraft) now unlock a new way. Think about who you are chasing...','Story 2 now flows into Story 3 with a takeoff transition, and beating Story 3 has a real ending']},'4.0':{t:'VERSION 4: SKYBOUND',i:['NEW intro: a getaway car hits the nitro, the cops fall away and the car blasts into a jet with a shockwave and contrails. Tap to skip, replay it from the menu (Intro button)','Beat Story 2 and there is a new ending: you realise the cops will chase you forever on the ground, until you find a live airfield. That leads straight into STORY 3: SKY RUN','Story 3 is the same game in the air: fly up, down, left and right through 6 sky worlds (cloud deck, golden dusk, thunder belt, midnight aurora, edge of space, skybreak) with missiles, heat-seekers, SAMs, jets, Air Force One with escorts, airliners, helicopters, balloons, drones, UFOs, satellites, asteroids and storm cells, while police jets chase you from behind','8 new aircraft in the new HANGAR, including the Skyhawk PD police helicopter, the Flare Hawk (press F for a Heat Burst that blows up heat-seeking missiles and scorches enemies nearby), a phase-shifting stealth jet and a flying tank','New booster: SKY SKIP. Skips all the driving stories and launches straight into Story 3','Cop Mode is now AIR PATROL: you stop a fleeing pilot with flak, storm cells, jets, blimp walls, gunships, SAM launchers and chase jets','Controls: W / up arrow fly up, S / down arrow fly down, F fires flares. Upgrade shop now upgrades aircraft too']},'3.2':{t:'VERSION 3.2: TANKS GET SERIOUS',i:['Tanks and armed cars now open fire almost instantly. Before, they only shot if you slowed way down. Watch for the red warning glow, it is shorter now!','NEW: Chaser Tanks in Story 2. Red armored tanks tail you like the cops do, but sit behind you and shell you in the back, so you can\u2019t just outrun them. Ram them a few times to wreck one. EMP shuts them down too','Cop Mode: placed Tanks fire much faster, and there is a new Chaser tool that drops a tank behind the runner (unlocks at a best score of 18000)','Fixed: A, S and D (and every other key) now type normally in the leaderboard name box and the reset box, instead of steering the car or triggering hotkeys']},'3.1':{t:'VERSION 3.1: THE CHASE LEVELS',i:['Cop Mode now has 5 levels: the runner drives better and better cars, and Level 5 (THE PHANTOM) can phase out of your traps','Beat the final level to earn the Interceptor, now a heavy cop car: slower, takes extra damage (hazards hurt much more), and the chopper can\u2019t tell you apart from the cops','Nebula Zero has a new perk: Phase Shift. Press G to ghost through everything for 3 seconds, then a 14 second cooldown. Works alongside nitro','Cop Mode rewards now scale with the level you beat']},'2.3':{t:'VERSION 3: FIGHTING BACK',i:['Story 2 turns deadly: tanks now fire shells and armed cars shoot bullets (watch for the red warning glow)','New booster: EMP Jammer, two pulses (press E) that knock out tank and armed-car weapons for 10 seconds','New mode: COP MODE. Switch sides and stop the runner with spikes, oil, patrols, roadblocks, choppers and tanks','Two new cars: the Interceptor (earned in Cop Mode) and one secret car','Reset progress button with a confirmation screen on the menu']},'2.1':{t:'VERSION 2.1: THE STORY CONTINUES',i:['Story 2 is no longer a menu button: beat Story 1 and the story rolls straight into it (Story 1 Skip starts you there)','Cinematic cutscenes with dialogue the first time you clear Story 1 and Story 2','Story 2 has all-new worlds: neon Tokyo, a skyline bridge, container docks, magma pass and aurora tundra','Story 2 pays far more, with army tanks, armored SWAT units and tougher cops','New car: Bastion XR, whose Rhino Frame softens traffic crashes','Animated title screen']},'2.0':{t:'VERSION 2 IS HERE',i:['Story 2: No Mercy — beat Story 1 to unlock 6 brutal chapters with huge payouts','Leaderboard: set a high score and add your name (local + global)','5 new expensive cars: 3 with special perks (steering, overboost, emergency lights) and one legendary...','New boosters (Story 1 Skip, Ghost Protocol, Combo King, Second Chance) and 2 new upgrades','Your progress is saved and carries over between updates (backup/restore on the menu)']}};
